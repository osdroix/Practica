<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">    <title>Js</title>
</head>
<body>
    <article class="article container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h1
                    class="text-start mb-4"
                    id="typewriter"
                    data-text="ACTIVIDADES DENTRO LAS CAPACITACIONES DE JAVASCRIPT">
                </h1>
            </div>
        </div>
        <div class="clare row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <label class="form-label">
                            Reto 1:
                            <br> 
                            Crea una función que reciba un valor y retorne 
                            un string que diga: <code>"El valor " + valor + " es de tipo " + typeof valor</code>.
                            Pruébalo con un número, un string, un booleano, 
                            un objeto y un undefined.
                        </label>
                        <form class="mt-3">
                            <div class="mb-3">
                                <label for="inputVar" class="form-label">Ingresa un valor</label>
                                <input type="text" class="form-control" id="inputVar" aria-describedby="roX">
                            </div>
                            <div class="mb-3" style="display: none;">
                                <textarea class="form-control" id="resultado" rows="3"></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Submit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </article>
</body>
<script src="JS/utils.js"></script>
<script src="JS/index.js"></script>
</html>
